version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.6
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.10.8
    - ruby@>=3.4.0
lint:
  definitions:
    - name: rubocop
      extra_packages:
        - rubocop@1.82.1
  disabled:
    - brakeman
    - eslint
    - hadolint
    - oxipng
    - prettier
    - rufo
    - semgrep
    - shfmt
    - standardrb
    - svgo
    - trivy
  ignore:
    - linters: [ALL]
      paths:
        - .pray/**
        - coverage/**
        - pkg/**
        - tmp/**
        - vendor/**
    - linters: [markdownlint]
      paths:
        - .agents/**
        - AGENTS.md
    - linters: [rubocop]
      paths:
        - usr/bin/**
  enabled:
    - actionlint@1.7.11
    - git-diff-check
    - gitleaks@8.30.0
    - markdownlint@0.48.0
    - osv-scanner@2.3.3
    - rubocop@1.82.1
    - shellcheck@0.11.0
    - yamllint@1.38.0
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
